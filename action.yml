# Composite GitHub Action wrapping `docgen ci` (build-plan.md M18; decisions #22-25). No model,
# no API key: installs docgen from this action's own checkout ($GITHUB_ACTION_PATH — never the
# consumer repo, which may be on a completely different stack), then runs the deterministic
# affected -> capture -> screenshot-diff -> PR-comment pipeline against the consumer's app and
# docgen config. `docgen init --ci` writes the workflow that calls this action with `uses:
# <owner>/<repo>@<ref>` configurable (default "elijah-g/docgen@main" — never hardcoded beyond
# that one default, per decisions #25).
name: "docgen ci"
description: "Deterministic PR check for docgen: affected walkthroughs -> capture -> screenshot diff -> one PR comment. No model, no API key."
author: "docgen"

inputs:
  config:
    description: "Path to docgen.config.ts/.mjs in the consumer repo, relative to its root."
    required: true
  app-url:
    description: "URL the app is already running at (the workflow starts it before calling this action)."
    required: true
  base:
    description: "Git ref/sha to diff against. Usually ${{ github.event.pull_request.base.sha }}."
    required: true
  head:
    description: "Git ref/sha to diff. Usually ${{ github.sha }}. Default HEAD."
    required: false
    default: "HEAD"
  github-token:
    description: "Token used to push preview images to the docgen-previews branch and post/update the PR comment. Usually secrets.GITHUB_TOKEN — no other key is needed."
    required: true
  pr-number:
    description: "Pull request number, for the PR comment. Not used with publish."
    required: false
    default: ""
  is-fork:
    description: "\"true\" when the PR's head repo isn't this repo. GitHub always gives a fork PR a read-only token, so this skips the push-to-docgen-previews/post-comment step and uploads the diff as an Actions artifact instead. Default false."
    required: false
    default: "false"
  publish:
    description: "\"true\" on a push to main: re-capture what --base..--head touched and write refreshed screenshots and pages into the help app (no PR comment). The calling workflow commits the docs folder afterwards."
    required: false
    default: "false"

outputs:
  ok:
    description: "\"true\" when no affected walkthrough broke."
    value: ${{ steps.run.outputs.ok }}
  artifact-uploaded:
    description: "\"true\" when the diff was uploaded as an artifact instead of posted as a PR comment (fork PR, or a push/comment call failed)."
    value: ${{ steps.run.outputs.artifact == 'true' }}

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', github.action_path)) }}

    - name: Install docgen (from this action's own checkout)
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        npm ci
        npm run build --workspace packages/engine
        npx playwright install --with-deps chromium

    - name: Run docgen ci
      id: run
      shell: bash
      env:
        # Only set for a same-repo PR (is-fork: false) — a fork PR's token can't push/comment
        # anyway, so --fork-pr below skips straight to the artifact fallback without trying.
        GITHUB_TOKEN: ${{ inputs.is-fork == 'true' && '' || inputs.github-token }}
        # Inputs go through env, never straight into the script, so no value can inject shell.
        DOCGEN_ACTION_PATH: ${{ github.action_path }}
        DOCGEN_CONFIG: ${{ inputs.config }}
        DOCGEN_BASE: ${{ inputs.base }}
        DOCGEN_HEAD: ${{ inputs.head }}
        DOCGEN_APP_URL: ${{ inputs.app-url }}
        DOCGEN_PR: ${{ inputs.pr-number }}
        DOCGEN_IS_FORK: ${{ inputs.is-fork }}
        DOCGEN_PUBLISH: ${{ inputs.publish }}
      working-directory: ${{ github.workspace }}
      run: |
        cli="$DOCGEN_ACTION_PATH/packages/engine/dist/cli.js"
        result="$RUNNER_TEMP/docgen-ci-result.json"
        if [ "$DOCGEN_PUBLISH" = "true" ]; then
          node "$cli" ci --publish \
            --config "$DOCGEN_CONFIG" \
            --base "$DOCGEN_BASE" \
            --head "$DOCGEN_HEAD" \
            --app-url "$DOCGEN_APP_URL" \
            --json | tee "$result"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));console.log('ok='+Boolean(r.ok));console.log('artifact=false')" "$result" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        fork_flag=()
        if [ "$DOCGEN_IS_FORK" = "true" ]; then fork_flag=(--fork-pr); fi
        node "$cli" ci \
          --config "$DOCGEN_CONFIG" \
          --base "$DOCGEN_BASE" \
          --head "$DOCGEN_HEAD" \
          --app-url "$DOCGEN_APP_URL" \
          --pr "$DOCGEN_PR" \
          "${fork_flag[@]}" \
          --json | tee "$result"
        node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));console.log('ok='+Boolean(r.ok));console.log('artifact='+(r.commentAction==='artifact'));console.log('artifact-dir='+(r.artifactDir||''))" "$result" >> "$GITHUB_OUTPUT"

    - name: Upload diff as an artifact (fork PR, or the comment/push step failed)
      if: steps.run.outputs.artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: docgen-ci-diff
        path: ${{ steps.run.outputs.artifact-dir }}
        retention-days: 14
